<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>T4C-Web — Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            't4c-main-bg': '#14101e',
            't4c-box-bg': '#1a1428',
            't4c-border': '#5a4a8a',
            't4c-text': '#d8d0f0',
            't4c-text-light': '#e8e0ff',
            't4c-gold': '#c8b87a',
            't4c-button': '#4a3a7a',
            't4c-button-hover': '#5d4a98',
            't4c-button-active': '#7a5ac8',
            't4c-input-bg': '#0c0a16',
            't4c-input-border': '#4a4070',
            't4c-danger': '#7a2a2a',
            't4c-danger-border': '#aa4a4a',
            't4c-success': '#2f7a4a',
            't4c-success-border': '#4aaa6a',
          }
        }
      }
    }
  </script>
  <style>
    .menu-item.active {
      background-color: #7a5ac8; /* t4c-button-active */
    }
    .tab-content {
        display: none;
    }
    .tab-content.visible {
        display: block;
    }
    #music-table th, #music-table td, #chars-table th, #chars-table td, #pantheon-table th, #pantheon-table td, #skin-items-table th, #skin-items-table td, #skin-mobs-table th, #skin-mobs-table td {
        padding: 0.75rem;
        border-bottom-width: 1px;
        border-color: #4a4070; /* t4c-input-border */
    }
    #music-table th, #chars-table th, #pantheon-table th, #skin-items-table th, #skin-mobs-table th {
        font-weight: bold;
        text-transform: uppercase;
        color: #c8b87a; /* t4c-gold */
        background-color: #0c0a16; /* t4c-input-bg */
    }
    select {
        background-color: #0c0a16; /* t4c-input-bg */
        border: 1px solid #4a4070; /* t4c-input-border */
        border-radius: 4px;
        color: #e8e0ff; /* t4c-text-light */
        padding: 4px 8px;
        outline: none;
    }
    select:focus {
        border-color: #7a5ac8; /* t4c-button-active */
    }
    option {
        background-color: #0c0a16; /* t4c-input-bg */
        color: #e8e0ff; /* t4c-text-light */
    }
  </style>
</head>
<body class="bg-t4c-main-bg text-t4c-text font-sans">
  <div id="login-box" class="max-w-sm mx-auto mt-20 bg-t4c-box-bg p-6 rounded-lg border border-t4c-border shadow-lg">
    <h1 class="text-2xl font-bold text-t4c-gold mb-6 text-center">Administration</h1>
    <div class="space-y-4">
      <input id="adm-name" class="block w-full bg-t4c-input-bg border border-t4c-input-border rounded-md px-3 py-2 text-t4c-text-light placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-t4c-button" placeholder="Compte admin">
      <input id="adm-pass" type="password" class="block w-full bg-t4c-input-bg border border-t4c-input-border rounded-md px-3 py-2 text-t4c-text-light placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-t4c-button" placeholder="Mot de passe">
    </div>
    <button id="adm-login" class="w-full mt-6 bg-t4c-button hover:bg-t4c-button-hover text-t4c-text-light font-bold py-2 px-4 rounded-md border border-t4c-border focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-t4c-box-bg focus:ring-t4c-button-active">Connexion</button>
    <p id="adm-error" class="text-red-400 mt-4 text-center min-h-[1.5em]"></p>
  </div>

  <div id="panel" style="display:none" class="h-screen flex">
    <aside id="sidebar" class="w-64 bg-t4c-box-bg p-4 border-r-2 border-t4c-border flex flex-col justify-between">
        <!-- sidebar component will be loaded here -->
    </aside>
    <main class="flex-1 p-6 overflow-y-auto">
      <div id="tab-map" class="tab-content"></div>
      <div id="tab-content" class="tab-content"></div>
      <div id="tab-spells-editor" class="tab-content"></div>
      <div id="tab-music" class="tab-content"></div>
      <div id="tab-skins" class="tab-content"></div>
      <div id="tab-chars" class="tab-content"></div>
      <div id="tab-pantheon" class="tab-content"></div>
    </main>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
