<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>T4C-Web — Administration</title>
  <!-- Tailwind compilé en local (npm run build:css) : le CDN Play était
       indisponible hors ligne / bloqué par les bloqueurs de pub. -->
  <link rel="stylesheet" href="/css/admin-tailwind.css">
  <!-- polices de la console ; hors ligne, repli sur les polices système -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    .tab-content {
        display: none;
    }
    .tab-content.visible {
        display: block;
        flex: 1 0 auto;
    }
    #music-table th, #music-table td, #skin-items-table th, #skin-items-table td, #skin-mobs-table th, #skin-mobs-table td {
        padding: 0.75rem;
        border-bottom-width: 1px;
        border-color: #2e323b; /* t4c-input-border */
    }
    #music-table th, #skin-items-table th, #skin-mobs-table th {
        font-weight: bold;
        text-transform: uppercase;
        color: #a8a397; /* gris des en-têtes de table */
        background-color: #111317; /* t4c-input-bg */
    }
    select {
        background-color: #111317; /* t4c-input-bg */
        border: 1px solid #2e323b; /* t4c-input-border */
        border-radius: 4px;
        color: #f3efe5; /* t4c-text-light */
        padding: 4px 8px;
        outline: none;
    }
    select:focus {
        border-color: #5a4a2a; /* t4c-button-active */
    }
    option {
        background-color: #111317; /* t4c-input-bg */
        color: #f3efe5; /* t4c-text-light */
    }
    /* ===== Restauration du style des composants generes par l'editeur de cartes
       Ces regles avaient ete supprimees par la migration Tailwind (e68077d),
       mais editor.js genere toujours ces classes (lignes de calques, boutons +,
       fiche d'edition de zone, onglet Templates). Les elements deja styles en
       Tailwind ne sont pas touches : la specificite d'une classe l'emporte sur
       le selecteur d'element. Le conteneur #edit-panel reste gere par Tailwind ;
       on ne restaure que son contenu. ===== */
    button { padding: 6px 14px; background: #1c1f24; color: #e8e4da; border: 1px solid #2e323b; border-radius: 5px; cursor: pointer; font-size: 13px; }
    button:hover { background: #24282f; }
    button.danger { background: #7a3229; border-color: #a8503f; }
    #edit-panel input, #edit-panel textarea, .edit-dlg input, .edit-dlg textarea {
      background: #111317; border: 1px solid #2e323b; border-radius: 4px; color: #e8e4da; padding: 6px 8px; font-size: 13px; }
    /* onglet Calques : une ligne par calque (oeil + nom + bouton +) */
    .layer-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; margin: 3px 0;
      background: #131418; border: 1px solid #22252b; border-radius: 6px; cursor: pointer; }
    .layer-row:hover { border-color: #2e323b; }
    .layer-row.current { border-color: #c9a45c; background: #202328; }
    .layer-row .layer-eye { width: 26px; height: 24px; padding: 0; font-size: 14px; flex: none;
      background: #1c1f24; line-height: 1; opacity: 0.45; }
    .layer-row.shown .layer-eye { opacity: 1; background: #2a2d34; }
    .layer-row .layer-name { flex: 1; font-size: 12px; color: #d3cec3; user-select: none; }
    .layer-row .layer-add { width: 26px; height: 24px; padding: 0; font-size: 15px; flex: none;
      font-weight: bold; line-height: 1; }
    /* onglet Templates : bouton d'enregistrement + liste des assemblages */
    .tpl-save { width: 100%; margin-bottom: 6px; }
    .tpl-save:disabled { opacity: 0.45; cursor: not-allowed; }
    .tpl-row { display: flex; align-items: center; gap: 6px; padding: 6px; margin: 4px 0;
      background: #131418; border: 1px solid #22252b; border-radius: 6px; }
    .tpl-row:hover { border-color: #2e323b; }
    .tpl-thumb { width: 40px; height: 40px; flex: none; background: #0b0c0f;
      border: 1px solid #22252b; border-radius: 4px; image-rendering: pixelated; }
    .tpl-info { flex: 1; min-width: 0; }
    .tpl-name { font-size: 12px; color: #d3cec3; font-weight: bold; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .tpl-sum { font-size: 10px; color: #8f8b82; }
    .tpl-acts { display: flex; gap: 3px; flex-wrap: wrap; }
    .tpl-acts button { padding: 2px 6px; font-size: 11px; line-height: 1.3; }
    /* fiche d'edition flottante (camps / PNJ / zones musicales / lumieres...) */
    #edit-panel h4 { color: #e9d3a0; font-size: 12px; margin: 10px 0 4px; }
    #edit-panel textarea { height: auto; }
    .edit-panel-title { display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; color: #e9d3a0; }
    .edit-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
    .edit-list { max-height: 140px; overflow-y: auto; background: #131418;
      border: 1px solid #262a31; border-radius: 5px; padding: 4px 6px; margin: 4px 0; }
    .edit-check { display: block; margin: 2px 0; cursor: pointer; }
    .edit-dlg { background: #131418; border: 1px solid #262a31; border-radius: 5px;
      padding: 6px; margin: 6px 0; }
    .edit-dlg input, .edit-dlg textarea { margin: 3px 0; }
  </style>
</head>
<body class="bg-t4c-main-bg text-t4c-text font-sans text-[13px] leading-[1.45]">
  <div id="login-box" class="max-w-sm mx-auto mt-20 bg-t4c-box-bg p-6 rounded-lg border border-t4c-border shadow-lg">
    <h1 class="font-serif font-semibold text-3xl text-t4c-gold mb-6 text-center">T4C <span class="font-sans font-medium text-base text-gray-500">Console</span></h1>
    <div class="space-y-4">
      <input id="adm-name" class="block w-full bg-t4c-input-bg border border-t4c-input-border rounded-md px-3 py-2 text-t4c-text-light placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-t4c-button" placeholder="Compte admin">
      <input id="adm-pass" type="password" class="block w-full bg-t4c-input-bg border border-t4c-input-border rounded-md px-3 py-2 text-t4c-text-light placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-t4c-button" placeholder="Mot de passe">
    </div>
    <button id="adm-login" class="w-full mt-6 bg-t4c-button hover:bg-t4c-button-hover text-t4c-text-light font-bold py-2 px-4 rounded-md border border-t4c-border focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-t4c-box-bg focus:ring-t4c-button-active">Connexion</button>
    <p id="adm-error" class="text-red-400 mt-4 text-center min-h-[1.5em]"></p>
  </div>

  <div id="panel" style="display:none" class="console">
    <!-- coque : en-tête + navigation + palette Ctrl K (display: contents) -->
    <div id="console-shell" style="display: contents"></div>
    <main id="console-main">
      <div id="page"></div>
      <div id="tab-map" class="tab-content"></div>
      <div id="tab-zone-props" class="tab-content"></div>
      <div id="tab-content" class="tab-content"></div>
      <div id="tab-spells-editor" class="tab-content"></div>
      <div id="tab-spells-table" class="tab-content"></div>
      <div id="tab-npcs-editor" class="tab-content"></div>
      <div id="tab-creatures" class="tab-content"></div>
      <div id="tab-objets" class="tab-content"></div>
      <div id="tab-particle-editor" class="tab-content"></div>
      <div id="tab-music" class="tab-content"></div>
      <div id="tab-skins" class="tab-content"></div>
      <div id="tab-materials" class="tab-content"></div>
      <div id="tab-atelier3d" class="tab-content"></div>
      <div id="tab-chars" class="tab-content"></div>
      <div id="tab-access" class="tab-content"></div>
      <div id="tab-pantheon" class="tab-content"></div>
    </main>
  </div>

  <!-- three.js vendoré (atelier 3D) : résolution des imports « three » -->
  <script type="importmap">
  { "imports": { "three": "/js/vendor/three/three.module.min.js", "three/addons/": "/js/vendor/three/addons/" } }
  </script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
