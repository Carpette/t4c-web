<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Quatrième Prophétie — Web</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body v-scope>
  <!-- Filtre de réfraction « verre liquide » : déforme légèrement le fond vu
       à travers les panneaux (backdrop-filter: url(#liquid-glass)). La houle
       est une turbulence basse fréquence -> ondulations larges, comme une
       vraie vitre épaisse. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="11" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <canvas id="game"></canvas>

  <div id="login" class="overlay" v-show="store.phase === 'login'"></div>

  <!-- HUD -->
  <div id="hud" v-show="store.phase === 'in-game'">
    <div id="hud-bars"></div>
    <div id="clock">🌞</div>

    <div id="chat"></div>

    <div id="hotbuttons">
      <button data-panel="inventory" title="Inventaire (I)">🎒</button>
      <button data-panel="character" title="Personnage (C)">📜</button>
      <button data-panel="spells" title="Sorts (S)">📖</button>
      <button data-panel="help" title="Aide (H)">❔</button>
    </div>

    <div id="zone-banner"></div>
    <div id="compass" title="Le nord du monde part vers le haut-droite de l'écran">N&nbsp;↗</div>
    <!-- barre d'incantation : se remplit pendant le temps de lancement du sort -->
    <div id="castbar" class="hidden"><div id="castbar-fill"></div><span id="castbar-label"></span></div>
    <div id="spellbar"></div>
    <div id="quickbar"></div>
    <div id="combat-indicator" class="hidden">⚔ MODE COMBAT</div>

    <!-- Inventaire T4C : poupée d'équipement + grille -->
    <div id="inventory" class="panel hidden"></div>

    <!-- Fiche personnage -->
    <div id="character" class="panel hidden"></div>

    <!-- Sorts et raccourcis -->
    <div id="spells" class="panel hidden"></div>

    <!-- Boutique -->
    <div id="shop" class="panel hidden"></div>

    <!-- Banque : coffre personnel -->
    <div id="bank" class="panel hidden"></div>

    <!-- Obélisque -->
    <div id="obelisk-panel" class="panel hidden"></div>

    <!-- Confirmation d'Épreuve -->
    <div id="trial-modal" class="overlay hidden">
      <div class="login-box" style="max-width: 460px">
        <h1>⚠ L'Épreuve</h1>
        <p id="trial-text" style="text-align: left; line-height: 1.6; margin: 14px 0"></p>
        <div class="login-buttons">
          <button id="btn-trial-go" class="danger-btn">Entrer dans l'Épreuve</button>
          <button id="btn-trial-no" class="secondary">Renoncer</button>
        </div>
      </div>
    </div>

    <!-- Aide -->
    <div id="help" class="panel hidden"></div>

    <div id="target-frame" class="hidden">
      <span id="target-name"></span>
      <div class="bar hp small"><div id="target-hp"></div></div>
      <button id="target-invite" class="secondary hidden">Inviter dans le groupe</button>
    </div>

    <!-- Groupe : membres et barres de PV -->
    <div id="party-panel" class="hidden"></div>

    <!-- Invitation de groupe reçue -->
    <div id="party-invite" class="hidden"></div>

    <!-- Menu de jeu (Échap) -->
    <div id="game-menu" class="overlay hidden">
      <div class="login-box" style="min-width: 300px">
        <h1>Menu</h1>
        <div id="menu-buttons">
          <button id="menu-resume">Reprendre</button>
          <button id="menu-settings" class="secondary">Paramètres</button>
          <button id="menu-about" class="secondary">À propos</button>
          <button id="menu-quit" class="danger-btn">Quitter la partie</button>
        </div>
        <div id="menu-settings-panel" class="hidden">
        </div>
        <div id="menu-about-panel" class="hidden">
          <h2 style="color:var(--gold);font-size:14px;margin:12px 0 8px">À propos</h2>
          <p style="font-size:14px;margin-bottom:6px">La Quatrième Prophétie — Hommage web</p>
          <p id="about-version" style="font-size:13px;color:var(--gold);margin-bottom:10px"></p>
          <p class="hint" style="font-size:11px;color:var(--text-muted);line-height:1.6">
            Hommage non officiel à <i>The 4th Coming</i> (Vircom / Dialsoft).<br>
            Graphismes : projet <a href="https://flarerpg.org" target="_blank" style="color:#8ac8ff">Flare</a>
            (CC-BY-SA) et contributions originales.<br>
            La version s'incrémente automatiquement à chaque commit.
          </p>
          <button id="about-back" class="secondary" style="margin-top:10px">Retour</button>
        </div>
      </div>
    </div>

    <div id="buffs-display"></div>
    <div id="floaters"></div>
    <div id="tooltip" class="hidden"></div>
    <!-- overlay discret ping / FPS (coin haut-droit), activé dans les paramètres -->
    <div id="perf-overlay" class="hidden"></div>
  </div>

  <!-- Écrans hors-jeu : DOIVENT rester hors de #hud (caché tant qu'on n'est
       pas en jeu), sinon ils sont invisibles à la connexion. -->
  <div id="death-screen" class="overlay" v-show="store.phase === 'death'">
    <div class="login-box" style="max-width: 480px">
      <h1>☠ Mort définitive</h1>
      <p id="death-by" style="margin: 10px 0"></p>
      <div id="pantheon"></div>
      <button id="btn-respawn">Créer un nouveau personnage</button>
    </div>
  </div>

  <div id="creation" class="overlay" v-show="store.phase === 'creation'"></div>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/gui/gui-manager.js"></script>
</body>
</html>
