<div class="bg-t4c-box-bg rounded-lg border border-t4c-border p-4" @vue:mounted="init()">
    <div class="toolbar flex items-center gap-2 mb-4">
        <button @click="loadChars" class="px-4 py-2 bg-t4c-button hover:bg-t4c-button-hover text-t4c-text-light font-bold rounded-md">Rafraîchir</button>
    </div>
    <p id="chars-msg" class="text-green-400 min-h-[1.5em]"></p>
    <table id="chars-table" class="w-full text-sm text-left text-gray-400 mt-4"></table>
    <p class="hint text-sm text-gray-400 bg-t4c-input-bg p-3 rounded-md border border-t4c-input-border mt-4">Modifier un champ puis « Appliquer ». Le joueur est déconnecté pour recharger ses données. « Supprimer » efface le personnage (le compte reste).</p>
</div>
