<div class="flex flex-col gap-4" v-if="ecran">
    <div class="flex items-end gap-4 flex-wrap">
        <div class="flex-1 min-w-[240px]">
            <h1 class="font-serif font-semibold text-[30px] leading-[1.1] text-t4c-text-light">{{ ecran.nom }} <span class="cs-chip align-middle font-sans" v-if="lecture" title="Votre profil donne la lecture seule sur cet écran">Lecture seule</span></h1>
            <p class="text-gray-400 mt-1">{{ ecran.desc }}</p>
        </div>
        <div role="tablist" :aria-label="ecran.nom" class="cs-segs" v-if="ecran.sous">
            <button v-for="s in ecran.sous" type="button" role="tab" class="cs-seg" :class="{ on: tab === s.tab }"
                :aria-selected="tab === s.tab" @click="choisir(s.tab)">{{ s.nom }}</button>
        </div>
    </div>

    <div class="cs-panel p-5 max-w-[720px] flex flex-col gap-3" v-if="ecran.bientot">
        <div class="flex items-center gap-2">
            <span class="cs-chip">Bientôt</span>
            <span class="text-gray-400">Cet écran est prévu ; le serveur ne le gère pas encore.</span>
        </div>
        <ul class="list-disc pl-5 text-gray-200 flex flex-col gap-1">
            <li v-for="p in ecran.prevu">{{ p }}</li>
        </ul>
    </div>
</div>
