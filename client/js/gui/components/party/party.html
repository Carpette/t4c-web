<div>
  <!-- solo : bouton qui ouvre le formulaire d'invitation -->
  <button v-if="!party && !showInvite" type="button" class="groupe-bouton" title="Former un groupe"
    aria-label="Former un groupe" @click="showInvite = true" v-html="ico.groupe"></button>

  <!-- formulaire d'invitation (solo, ou chef d'un groupe non complet) -->
  <form v-if="showInvite && (!party || (isLeader && party.members.length < 5))" class="party-box groupe-inviter"
    @submit.prevent="sendInvite()">
    <h3>Former un groupe</h3>
    <input v-model="inviteName" placeholder="Nom du joueur…" aria-label="Nom du joueur à inviter">
    <div class="groupe-boutons">
      <button type="submit" class="petit">Inviter</button>
      <button type="button" class="secondary petit" @click="showInvite = false">Fermer</button>
    </div>
    <p class="hint">Aussi : <code>/inviter Nom</code>, ou le panneau Joueurs (O). L'expérience est partagée à portée.</p>
  </form>

  <!-- groupé : cadres des membres (PV en temps réel) -->
  <div v-if="party" class="party-box">
    <h3>Groupe ({{ party.members.length }}/5)</h3>
    <div v-for="m in party.members" :key="m.id" class="party-row">
      <div class="party-name">
        <span :class="{ leader: m.id === party.leaderId }">
          <span v-if="m.id === party.leaderId" v-html="ico.couronne" title="Chef du groupe"></span>
          {{ m.name }} <span class="hint">niv {{ m.level }}</span>
        </span>
        <button v-if="isLeader && m.id !== party.leaderId" type="button" class="kick" title="Exclure"
          :aria-label="'Exclure ' + m.name" @click="kick(m)" v-html="ico.fermer"></button>
      </div>
      <div class="party-hp"><div :style="hpStyle(m)"></div></div>
    </div>
    <button v-if="isLeader && party.members.length < 5" type="button" class="petit bouton-plein" @click="showInvite = true">Inviter</button>
    <button id="party-leave" type="button" class="secondary petit bouton-plein" @click="leave()">Quitter le groupe</button>
  </div>

  <!-- invitation reçue : encart au-dessus du chat, compte à rebours -->
  <div v-if="invite" class="groupe-invitation" role="alertdialog" aria-label="Invitation de groupe">
    <b>{{ invite.from }}</b> vous invite dans son groupe.
    <div class="groupe-boutons">
      <button type="button" class="petit" @click="accept()">Accepter</button>
      <button type="button" class="secondary petit" @click="decline()">Refuser ({{ inviteLeft }} s)</button>
    </div>
  </div>
</div>
