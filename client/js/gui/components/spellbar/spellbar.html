<div class="barre-sorts" role="toolbar" aria-label="Sorts à raccourci">
  <button v-for="sp in sorts" :key="sp.id" type="button" class="spell-slot"
    :class="{ active: state.activeSpell === sp.id }" :aria-pressed="state.activeSpell === sp.id"
    :title="sp.name + ' — ' + sp.mana + ' mana — touche ' + sp.touche.toUpperCase()"
    @click="basculer(sp.id)">
    <span class="icon" v-html="icone(sp)"></span>
    <span class="key">{{ sp.touche.toUpperCase() }}</span>
    <span class="cd" v-if="recharge(sp.id) > 0">{{ recharge(sp.id) }}</span>
  </button>
</div>
