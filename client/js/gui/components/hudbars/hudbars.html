<div v-if="s">
  <!-- vie basse : liseré rouge pulsant sur les bords de l'écran -->
  <div id="alerte-vie" :class="{ on: s.maxHp && hpPct < 30 && s.hp > 0 }" aria-hidden="true"></div>
  <div id="vitals">
    <div class="bar hp" :class="{ basse: s.maxHp && hpPct < 30 }">
      <div :style="{ width: hpPct + '%' }"></div>
      <span v-if="s.maxHp">{{ Math.round(s.hp) }} / {{ s.maxHp }}</span>
    </div>
    <div class="bar mana">
      <div :style="{ width: manaPct + '%' }"></div>
      <span v-if="s.maxMana">{{ Math.round(s.mana) }} / {{ s.maxMana }}</span>
    </div>
    <div class="bar xp">
      <div :style="{ width: xpPct + '%' }"></div>
      <span>Niv. {{ s.level }} — {{ Math.floor(xpInto) }} / {{ xpSpan }} XP</span>
    </div>
  </div>
  <div id="gold-display" title="Or"><span v-html="or"></span> <span>{{ s.gold }}</span></div>
</div>
